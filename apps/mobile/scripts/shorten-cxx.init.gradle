// Init script de Gradle — acorta los directorios de build de CMake (.cxx).
//
// Por qué: en Windows los .o de CMake replican la ruta ABSOLUTA del fuente
// dentro de CMakeFiles/<target>.dir/ y el prefijo del repo revienta MAX_PATH
// (260). Síntoma: ninja falla con
//   "manifest 'build.ninja' still dirty after 100 tries"
// (visto en bookhoard-v2 el 2026-07-24 con react-native-worklets al migrar a
// SDK 56 / new arch — GamerHoard arrastra la misma dependencia vía expo-router).
//
// Qué hace: para cada módulo Android, mueve externalNativeBuild.cmake (el .cxx)
// a C:\_cxx\gh\<módulo>. Se aplica pasándolo al build:
//   gradlew ... -I ..\scripts\shorten-cxx.init.gradle
// OJO: NO usar una unidad `subst` para acortar rutas: el codegen de RN hace
// fs.realpath y muere con "this and base files have different roots".
def SHORT_BASE = 'C:/_cxx/gh'

gradle.beforeProject { p ->
  ['com.android.application', 'com.android.library'].each { id ->
    p.plugins.withId(id) {
      def android = p.extensions.findByName('android')
      if (android != null) {
        try {
          android.externalNativeBuild.cmake.buildStagingDirectory =
            new File(SHORT_BASE, p.name.replaceAll('[^A-Za-z0-9-]', '_'))
        } catch (Throwable ignored) {
          // módulo sin CMake — no pasa nada
        }
      }
    }
  }
}
